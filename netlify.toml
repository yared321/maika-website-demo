# Publish static demo + Netlify Functions (production).
# Optional Cloudflare Pages + /functions: see wrangler.toml and doc/cloudflare-pages.md.
# Face assess uploads use multipart bodies; Netlify Functions have payload and wall-clock limits—see scripts/README.proxy.md.

[build]
  command = "npm run build"
  publish = "site"

[functions]
  directory = "netlify/functions"
  # esbuild bundles ESM handlers correctly. zisi emitted a CJS wrapper that `require()`d
  # `.mjs` files (ERR_REQUIRE_ESM). Runtime env from the Netlify UI still comes from
  # `process.env` inside the handler; we do not use esbuild `define` for secrets.
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/demo/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/demo"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/demo/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/api/face-assess/*"
  to = "/.netlify/functions/face-assess-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo-verify"
  to = "/.netlify/functions/demo-verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo-code-create"
  to = "/.netlify/functions/demo-code-create"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo-code-revoke"
  to = "/.netlify/functions/demo-code-revoke"
  status = 200
  force = true

# Allow embedding the demo in partner sites (iframe). Parent must set allow="camera; autoplay".
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/demo"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/demo/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
