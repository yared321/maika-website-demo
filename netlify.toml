# Static site deploy. Face-assess API: use `npm run dev` locally or add a Netlify/server proxy.
# See scripts/README.proxy.md

[build]
  publish = "site"

[[redirects]]
  from = "/"
  to = "/demo/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/demo"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/demo/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/api/face-assess/*"
  to = "/.netlify/functions/face-assess-proxy"
  status = 200
  force = true

# Allow embedding the demo in partner sites (iframe). Parent must set allow="camera; autoplay".
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/demo"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/demo/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
